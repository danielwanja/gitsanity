[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist). A `v*` tag triggers .github/workflows/release.yml,
# which builds every target on a native runner, publishes a GitHub Release with
# archives, checksums and a shell installer, and pushes the Homebrew formula.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Homebrew tap the formula is pushed to (needs the HOMEBREW_TAP_TOKEN secret)
tap = "danielwanja/homebrew-tap"
publish-jobs = ["homebrew"]
# The version is still an alpha; publish those to the tap as well
publish-prereleases = true
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
# Where the shell installer puts the binary (no sudo, no Rust toolchain needed)
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# cargo-dist 0.33 asks for macos-14 on Apple Silicon, which GitHub has retired
# ("The configuration 'macos-14-arm64-us-default' is not supported").
# cargo-dist 0.34 defaults to macos-15; drop this once the version above is bumped.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
